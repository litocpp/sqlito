[package]
name = "sqlito-sqlite"
version = "3.53.4"
standard = "c99"

[external-sources.sqlite]
archive = "https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip"
sha256 = "1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d"

[source-groups.sqlite]
external-source = "sqlite"
sources = ["sqlite3.c"]

[lib]
name = "sqlito-sqlite"
archive = "sqlito-sqlite"
source-groups = ["sqlite"]

[usage]
public-include-directories = [{ external-source = "sqlite", path = "." }]
private-definitions = ["SQLITE_THREADSAFE=1", "SQLITE_ENABLE_FTS5", "SQLITE_OMIT_LOAD_EXTENSION"]
threads = true
system-libraries = ["m"]
