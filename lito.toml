[package]
name = "sqlito"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[lib]
name = "sqlito"
module = "sqlito"
archive = "sqlito"
source-groups = ["sqlite"]

[external-sources.sqlite]
archive = "https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip"
sha256 = "1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d"

[source-groups.sqlite]
external-source = "sqlite"
standard = "c99"
sources = ["sqlite3.c"]

[usage]
public-include-directories = [{ external-source = "sqlite", path = "." }]
private-definitions = ["SQLITE_THREADSAFE=1", "SQLITE_ENABLE_FTS5", "SQLITE_OMIT_LOAD_EXTENSION"]
threads = true
system-libraries = ["m"]

[[test]]
name = "sqlito-tests"
sources = ["tests/main.cpp", "tests/connections.cpp", "tests/statements.cpp", "tests/transactions.cpp", "tests/cancellation.cpp", "tests/executor.cpp", "tests/blobs.cpp", "tests/returning.cpp", "tests/fts.cpp", "tests/scalar.cpp", "tests/memory.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.2", pub = true }

[dev-dependencies]
rstd-test = { version = "0.1.2" }
rstd-nostd = { version = "0.1.2", usage = "link" }
