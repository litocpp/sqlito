[package]
name = "sqlito"
version = "0.1.1"
license = "MIT OR Apache-2.0"

[lib]
name = "sqlito"
module = "sqlito"
archive = "sqlito"

[features.vendored]
default = false

[external-dependencies.pkg-config.sqlite]
module = "sqlite3"
version = ">= 3.47.0"
pub = true
condition = "!feature.vendored"

[[test]]
name = "sqlito-tests"
sources = ["tests/main.cpp", "tests/connections.cpp", "tests/statements.cpp", "tests/transactions.cpp", "tests/cancellation.cpp", "tests/executor.cpp", "tests/blobs.cpp", "tests/returning.cpp", "tests/fts.cpp", "tests/scalar.cpp", "tests/memory.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.2", pub = true }
sqlite = { version = "3.53.4", pub = true, features = ["fts5", "omit-load-extension"], condition = "feature.vendored" }

[dev-dependencies]
rstd-test = { version = "0.1.2" }
rstd-nostd = { version = "0.1.2", usage = "link" }
